apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prom
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cappymayor/prometheus-setup.git
    targetRevision: HEAD
    path: helm_path

    helm:
      releaseName: prometheus
      parameters:
        - name: "environment"
          value: Production
    
      valueFiles: 
      - helm_path/values.yaml


  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
    - CreateNamespace=true
